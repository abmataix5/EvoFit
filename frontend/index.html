<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EvoFit" />
    <title>EvoFit</title>
    <meta name="description" content="Entrena. Mejora. Evoluciona. Seguimiento de progreso en el gym." />
    <meta name="theme-color" content="#0c1219" />
    <script>
      // Tema antes de pintar (sin parpadeo). 'auto' sigue al sistema.
      try {
        var pref = localStorage.getItem('evofit:theme') || 'dark'
        var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (light) document.querySelector('meta[name=theme-color]').setAttribute('content', '#f2f4f7')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
