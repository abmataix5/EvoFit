<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EvoFit" />
    <title>EvoFit · Entrena, mejora, evoluciona</title>
    <meta
      name="description"
      content="EvoFit es la app web para apuntar tus entrenos, ver tu progreso semana a semana y competir con tus amigos en una liga semanal. Rutinas, récords, agenda e informes."
    />
    <link rel="canonical" href="https://evofit.fitness/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EvoFit" />
    <meta property="og:title" content="EvoFit · Entrena, mejora, evoluciona" />
    <meta property="og:description" content="Apunta tus entrenos, mira cómo progresas y pícate con tus amigos. App web: sin tienda de apps." />
    <meta property="og:url" content="https://evofit.fitness/" />
    <meta property="og:image" content="https://evofit.fitness/logo.png" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0c1219" />
    <script>
      // Tema antes de pintar (sin parpadeo). 'auto' sigue al sistema.
      try {
        var pref = localStorage.getItem('evofit:theme') || 'dark'
        var light = pref === 'light' || (pref === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (light) document.querySelector('meta[name=theme-color]').setAttribute('content', '#f2f4f7')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
