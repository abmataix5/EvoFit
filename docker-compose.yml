services:
  mariadb:
    image: mariadb:11.4
    container_name: evofit-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MARIADB_DATABASE: ${DB_DATABASE:-evofit}
      MARIADB_USER: ${DB_USERNAME:-evofit}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evofit-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_NAME: EvoFit
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8080}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-evofit}
      DB_USERNAME: ${DB_USERNAME:-evofit}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:${FRONTEND_PORT:-5173},127.0.0.1,127.0.0.1:${FRONTEND_PORT:-5173}
      SESSION_DOMAIN: ""
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evofit-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  mariadb_data:
  backend_vendor:
  frontend_node_modules:
