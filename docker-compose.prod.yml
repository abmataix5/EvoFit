# Producción EvoFit — un solo dominio (web + API detrás de Caddy)

services:
  mariadb:
    image: mariadb:11.4
    container_name: evofit-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-evofit}
      MARIADB_USER: ${DB_USERNAME:-evofit}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evofit

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evofit-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      # Volumen histórico (antes servido por Caddy en /storage). Se mantiene para no
      # perder fotos antiguas: el arranque las mueve a storage/app/private.
      - backend_storage:/var/www/html/storage/app/public
      # Archivos privados (fotos de progreso).
      - backend_private:/var/www/html/storage/app/private
      # Copias de la BD antes de cada migración (y las diarias del servicio backup).
      - ./backups:/backups
    environment:
      APP_NAME: EvoFit
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-evofit}
      DB_USERNAME: ${DB_USERNAME:-evofit}
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      # Workers de `artisan serve` (php -S) para atender peticiones en paralelo.
      PHP_CLI_SERVER_WORKERS: ${PHP_CLI_SERVER_WORKERS:-4}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Correo (avisos de solicitudes de amistad). Sin configurar, se escriben en el log.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@evofit.app}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-EvoFit}
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - evofit

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    container_name: evofit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # Por defecto el dominio tal cual => HTTPS automático. Detrás de Cloudflare en modo
      # "Flexible" pon SITE_ADDRESS=http://tu-dominio en .env (ver deploy/Caddyfile).
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.localhost}
    extra_hosts:
      # Para llegar al servidor de correo, que publica sus puertos en el host.
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - evofit

  # Copia diaria: volcado de la BD + fotos en ./backups del host (14 días de retención).
  backup:
    image: mariadb:11.4
    container_name: evofit-backup
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_DATABASE: ${DB_DATABASE:-evofit}
      DB_USERNAME: ${DB_USERNAME:-evofit}
      MYSQL_PWD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - backend_storage:/data/public:ro
      - backend_private:/data/private:ro
      - ./deploy/backup.sh:/usr/local/bin/evofit-backup.sh:ro
    entrypoint: ["bash", "/usr/local/bin/evofit-backup.sh"]
    networks:
      - evofit

volumes:
  mariadb_data:
  backend_vendor:
  backend_storage:
  backend_private:
  caddy_data:
  caddy_config:

networks:
  evofit:
    driver: bridge
