# Producción EvoFit — un solo dominio (web + API detrás de Caddy)

services:
  mariadb:
    image: mariadb:11.4
    container_name: evofit-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE:-evofit}
      MARIADB_USER: ${DB_USERNAME:-evofit}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - evofit

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evofit-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage/app/public
    environment:
      APP_NAME: EvoFit
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-evofit}
      DB_USERNAME: ${DB_USERNAME:-evofit}
      DB_PASSWORD: ${DB_PASSWORD}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - evofit

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    container_name: evofit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - backend_storage:/srv/storage:ro
    depends_on:
      - backend
    networks:
      - evofit

volumes:
  mariadb_data:
  backend_vendor:
  backend_storage:
  caddy_data:
  caddy_config:

networks:
  evofit:
    driver: bridge
